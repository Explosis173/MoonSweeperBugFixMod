[ChunkLoader]
; 1 = an, 0 = aus (im Spiel mit F8 umschaltbar)
Enabled=1
; Maschinen naeher als so viele Meter teilen sich einen Anker
CellSize=300
; Maximale Anzahl Anker (mehr = mehr geladen, aber mehr Leistung noetig)
MaxAnchors=64
; Auch Foerderbaender verankern
IncludeBelts=1
; Jeder aktive Roboter haelt seine Umgebung selbst geladen
FollowRobots=1
; Wie oft (Sekunden) die Anker neu berechnet werden
RefreshSeconds=5
; Virtual-Key-Code der Umschalttaste (119 = F8)
ToggleKey=119
; Kapseln auf alle Empfaenger verteilen statt immer zum naechsten
BalanceCapsules=1
; Wie viele Sekunden Wartezeit ein voller Empfaenger-Speicher zaehlt
FillPenaltySeconds=60
